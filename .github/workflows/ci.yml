# Continuous integration.
#
# The three checks a contributor can run locally, run again on every push and
# pull request, plus a size budget. The budget is the one that needs explaining:
# this site's whole argument is that a portfolio does not need much JavaScript,
# and a claim like that decays silently. Failing the build when a page's CSS or
# JavaScript grows past its budget is what keeps it true.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run typecheck` runs `next typegen` first. It has to: the file that
      # declares CSS modules and the route types is generated, and generated
      # files are not committed, so a fresh clone has no such declarations and
      # `tsc` fails on every stylesheet import.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

      - name: Audit
        run: npm audit --audit-level=high
