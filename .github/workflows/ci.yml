# Continuous integration.
#
# Cloudflare Pages builds this repository itself, from its own Git integration,
# and it does not wait for this workflow. So CI is not a gate in front of a
# deployment — it is the thing that has to notice a problem before Cloudflare
# ships it, which only works if it builds what Cloudflare builds.
#
# That is why the build here runs the same command the Pages project's build
# setting names, with `CONTACT_ENDPOINT` set the way the Pages project sets it.
# Without that variable the contact page renders an email address instead of a
# form, and every check below would pass on a build of a site with no form in it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Cloudflare deploys on its own schedule rather than this one, so being able to
  # re-run these checks against a branch without pushing to it is worth the line.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # What the Pages project sets, so the export CI checks is the export it serves.
  CONTACT_ENDPOINT: /api/contact

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches the Node version in the Cloudflare Pages build image, and the
      # one `--experimental-strip-types` needs to run the `.ts` files directly.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run typecheck` runs `next typegen` first. It has to: the file that
      # declares CSS modules and the route types is generated, and generated
      # files are not committed, so a fresh clone has no such declarations and
      # `tsc` fails on every stylesheet import.
      #
      # It covers `functions/` as well as `src/`, which is the only check the
      # Pages Function gets before Cloudflare bundles it.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The contact endpoint is the only code here that runs per request and
      # takes input from strangers, so it is the only code with unit tests.
      - name: Test
        run: npm test

      # `next build` and `npm run build:static` are the same command; the second
      # name exists because it is what the Pages project's build setting says.
      - name: Build
        run: npm run build:static

      - name: Size budget
        run: npm run size

      # Reads the export as files: every page emitted, every internal link
      # resolvable without a server, every redirect pointing somewhere real, and
      # nothing loaded from an origin the Content-Security-Policy forbids.
      - name: Export check
        run: npm run check:export

      # Reads it as a site: serves `out/` with Cloudflare's own path resolution,
      # redirect rules and headers, and submits the contact form through the
      # Function. Nothing is sent — the mail provider is stubbed.
      - name: Smoke test
        run: npm run smoke

      - name: Audit
        run: npm audit --audit-level=high
