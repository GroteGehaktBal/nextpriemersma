# Dependabot keeps the dependency list current.
#
# The previous version of this file was the GitHub scaffold with an empty
# `package-ecosystem`, which is not a valid value — it never opened a single
# pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the framework rather than four that have to land
      # together.
      next:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
